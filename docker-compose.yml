# One-command runtime for hf_group_backend: the Django/gunicorn app.
#
# This file "captures" the whole deployment — image build, restart policy,
# host networking, and the env-file wiring — so bring-up is a single command.
#
# Secrets are DELIBERATELY not in here and not in the image (.dockerignore
# excludes .env). They live ONLY in the server-side file referenced by env_file
# below, created from .env.example. Never in git, never inside the image tar.
#
#   Bring everything up:   docker compose up -d --build
#   Tail app logs:         docker compose logs -f web
#   Restart just the app:  docker compose restart web
#   Stop everything:       docker compose down
#
# No Redis/Celery: the cache is Django's DatabaseCache (Postgres), and the two
# scheduled jobs run from host cron (see docs/DEPLOY.md):
#   */5 * * * *  docker compose exec -T web python manage.py precompute_slides
#   0 */6 * * *  docker compose exec -T web python manage.py run_insights_pipeline
#
# Host networking is used so gunicorn binds the host's :9000 (same-port cutover,
# no new firewall rule) and the app reaches host-local Postgres (127.0.0.1:5432).

services:
  web:
    build: .
    image: hf-backend:latest
    network_mode: host
    restart: unless-stopped
    # Secrets come from this file on the SERVER ONLY. Create it from
    # .env.example (cp .env.example /etc/hf/prod.env, then fill it in). If it is
    # missing, compose fails fast with a clear error instead of starting a
    # misconfigured app — that is the safe behaviour.
    env_file:
      - /etc/hf/prod.env
